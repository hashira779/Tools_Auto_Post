# ══════════════════════════════════════════════════════════════════
#  CamTech — Unified Docker Compose
# ══════════════════════════════════════════════════════════════════
#  All services in the monorepo. Run with:
#    docker compose up --build
#
#  Or run individual services:
#    docker compose up savemedia-frontend savemedia-api
#    docker compose up auto-post-bot
# ══════════════════════════════════════════════════════════════════

services:

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  #  Redis (For Queue & Rate Limiting)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  redis:
    image: redis:7-alpine
    container_name: camtech-redis
    # Cap memory so Redis can never OOM the host; noeviction keeps
    # Celery queue data safe (tasks are never silently dropped).
    command: >
      redis-server
        --maxmemory 256mb
        --maxmemory-policy noeviction
        --appendonly yes
        --appendfsync everysec
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped
    networks:
      - camtech-net

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  #  SaveMedia Web — Video/Audio Downloader
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  savemedia-frontend:
    build:
      context: ./services/savemedia-web/frontend
      dockerfile: Dockerfile
    container_name: camtech-savemedia-frontend
    ports:
      - "${SAVEMEDIA_PORT:-80}:80"
    depends_on:
      - savemedia-api
      - sticker-api
    restart: unless-stopped
    networks:
      - camtech-net

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  #  SaveMedia API (FastAPI) & Celery Worker
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  savemedia-api:
    build:
      context: ./services/savemedia-web/media-api
      dockerfile: Dockerfile
    container_name: camtech-savemedia-api
    environment:
      - DOWNLOAD_DIR=/tmp/savemedia_downloads
      - COOKIES_FILE=${COOKIES_FILE:-}
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - savemedia-downloads:/tmp/savemedia_downloads
    expose:
      - "8000"
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - camtech-net

  savemedia-worker:
    build:
      context: ./services/savemedia-web/media-api
      dockerfile: Dockerfile
    container_name: camtech-savemedia-worker
    command: celery -A app.celery_worker.celery_app worker --concurrency=4 --loglevel=info
    environment:
      - DOWNLOAD_DIR=/tmp/savemedia_downloads
      - COOKIES_FILE=${COOKIES_FILE:-}
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - savemedia-downloads:/tmp/savemedia_downloads
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      # Celery workers don't serve HTTP — check the process is alive instead
      test: ["CMD-SHELL", "celery -A app.celery_worker.celery_app inspect ping --timeout 5 2>/dev/null | grep -q pong || exit 1"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - camtech-net

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  #  Auto Post Bot — Telegram Bot
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  auto-post-bot:
    build:
      context: .
      dockerfile: ./services/auto-post-bot/Dockerfile
    container_name: camtech-auto-post-bot
    env_file:
      - .env
    volumes:
      - ./credentials:/app/credentials:ro
      # cookies.txt is gitignored — create it locally on the server (yt-dlp session cookies)
      - ./cookies.txt:/app/cookies.txt:ro
      - bot-downloads:/app/downloads
    healthcheck:
      # Bot is a long-running Python process — check it's alive
      test: ["CMD-SHELL", "ps aux | grep -v grep | grep -q 'python' || exit 1"]
      interval: 60s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
    networks:
      - camtech-net

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  #  Screen Share Signaling API (WebRTC)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  screen-share-api:
    build:
      context: ./services/screen-share-api
      dockerfile: Dockerfile
    container_name: camtech-screen-share
    restart: unless-stopped
    environment:
      - ROOM_EXPIRATION_MINUTES=${ROOM_EXPIRATION_MINUTES:-30}
    # No need to expose ports globally if it goes through nginx, but good for local dev
    ports:
      - "4000:4000"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:4000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - camtech-net

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  #  Cloudflare Tunnel (Secure Public Access)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: camtech-tunnel
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    restart: unless-stopped
    networks:
      - camtech-net

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  #  Sticker Maker API — Microservice for Telegram Stickers
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  sticker-api:
    build:
      context: ./services/sticker-maker/sticker-api
      dockerfile: Dockerfile
    container_name: camtech-sticker-api
    environment:
      - STICKER_BOT_TOKEN=${STICKER_BOT_TOKEN:-${TELEGRAM_BOT_TOKEN:-}}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - ALLOWED_USERS=${ALLOWED_USERS:-}
      - STICKER_BOT_OWNER_ID=${STICKER_BOT_OWNER_ID:-}
      - DEFAULT_STICKER_USER_ID=${DEFAULT_STICKER_USER_ID:-}
      - GOOGLE_APPLICATION_CREDENTIALS=/app/credentials/google_credentials.json
    volumes:
      - ./credentials:/app/credentials:ro
    expose:
      - "8001"
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/api/health')" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - camtech-net

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  #  MMS-TTS — Offline Khmer Voice (CPU Optimized)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  mms-tts:
    build:
      context: ./services/mms-tts
      dockerfile: Dockerfile
    container_name: camtech-mms-tts
    restart: unless-stopped
    expose:
      - "8002"
    # Healthcheck is defined in the Dockerfile (uses Python urllib, not curl)
    networks:
      - camtech-net

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  #  Kokoro-82M TTS — Premium Voice AI (CPU Optimized)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  kokoro-tts:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    container_name: camtech-kokoro-tts
    restart: unless-stopped
    expose:
      - "8880"
    environment:
      - DEVICE=cpu
      - ONNX_NUM_THREADS=8
      - ONNX_INTER_OP_THREADS=4
      - PYTORCH_NUM_THREADS=8
    volumes:
      - kokoro-models:/app/api/src/models
      - kokoro-voices:/app/api/src/voices
      - kokoro-temp:/tmp/kokoro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8880/health"]
      interval: 30s
      timeout: 10s
    networks:
      - camtech-net

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  #  Ollama — Local LLM API (Optimized for 3B–8B Quantized Models)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  ollama:
    image: ollama/ollama:latest
    container_name: camtech-ollama
    restart: unless-stopped
    # If your Ubuntu server has an NVIDIA GPU, uncomment the deploy section below:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - camtech-net

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  #  CAMTECH Database (PostgreSQL with pgvector)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  postgres:
    image: pgvector/pgvector:pg15
    container_name: camtech-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: camtech
      POSTGRES_PASSWORD: camtechpassword
      POSTGRES_DB: camtech
    ports:
      # Expose PostgreSQL to LAN so ORS workers can connect
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Custom pg_hba.conf to allow ORS worker connections
      - ./config/pg_hba.conf:/etc/postgresql/pg_hba.conf
    command: >
      postgres
        -c listen_addresses='*'
        -c hba_file=/etc/postgresql/pg_hba.conf
        -c max_connections=300
        -c shared_buffers=1GB
        -c work_mem=16MB
        -c maintenance_work_mem=256MB
        -c effective_cache_size=4GB
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U camtech -d camtech"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - camtech-net

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  #  AI Orchestrator API
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  ai-orchestrator-api:
    build:
      context: ./services/ai-orchestrator-api
      dockerfile: Dockerfile
    container_name: camtech-ai-orchestrator
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - OLLAMA_URL=http://ollama:11434
    depends_on:
      postgres:
        condition: service_healthy
      ollama:
        condition: service_started
    volumes:
      - ai-uploads:/app/uploads
    # Healthcheck is defined in the Dockerfile
    networks:
      - camtech-net

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  #  Admin Console (standalone React SPA)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  admin-web:
    build:
      context: ./services/admin-web
      dockerfile: Dockerfile
      args:
        - VITE_SUPABASE_URL=${SUPABASE_URL}
        - VITE_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
    container_name: camtech-admin-web
    depends_on:
      - ai-orchestrator-api
    ports:
      - "8080:80"
    networks:
      - camtech-net


  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  #  Stirling-PDF — 50+ PDF Tools (Edit, Merge, Convert, OCR...)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  stirling-pdf:
    image: stirlingtools/stirling-pdf:latest
    container_name: camtech-stirling-pdf
    environment:
      - SERVER_SERVLET_CONTEXT_PATH=/pdf
      - SYSTEM_ROOTURI=/pdf
      - SYSTEM_ROOTPATH=/pdf
      - SECURITY_ENABLELOGIN=false
      - DOCKER_ENABLE_SECURITY=false
      - SYSTEM_DEFAULTLOCALE=en_US
      - UI_APPNAME=CamTech PDF Tools
      - SYSTEM_MAXFILESIZE=500
      - UI_HOMEDESCRIPTION=Free PDF tools - Edit, merge, split, compress, convert and more
      - SYSTEM_ENABLEANALYTICS=false
      - PREMIUM_ENABLED=true
      - PREMIUM_PRO_FEATURES_GOOGLE_DRIVE_ENABLED=true
      - PREMIUM_PRO_FEATURES_GOOGLE_DRIVE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - PREMIUM_PRO_FEATURES_GOOGLE_DRIVE_API_KEY=${GOOGLE_API_KEY}
      - PREMIUM_PRO_FEATURES_GOOGLE_DRIVE_APP_ID=639870274155
    volumes:
      - stirling-data:/usr/share/tessdata
      - stirling-configs:/configs
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/pdf/api/v1/info/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    networks:
      - camtech-net

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  #  n8n — Workflow Automation Engine
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  n8n:
    image: n8nio/n8n:latest
    container_name: camtech-n8n
    restart: unless-stopped
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=camtech
      - DB_POSTGRESDB_USER=camtech
      - DB_POSTGRESDB_PASSWORD=camtechpassword
      - DB_POSTGRESDB_SCHEMA=n8n
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD:-camtech_n8n}
      - WEBHOOK_URL=http://n8n:5678/
      - GENERIC_TIMEZONE=Asia/Phnom_Penh
    ports:
      - "5678:5678"
    volumes:
      - n8n-data:/home/node/.n8n
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1",
             "--spider", "http://127.0.0.1:5678/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - camtech-net

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  #  Coturn (TURN/STUN Server for WebRTC ICE Fallback)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  coturn:
    image: coturn/coturn:latest
    container_name: camtech-coturn
    restart: unless-stopped
    network_mode: "host"
    command:
      - -n
      - --log-file=stdout
      - --lt-cred-mech
      - --fingerprint
      - --listening-port=3478
      - --min-port=50000
      - --max-port=50100
      - --user=camtech:camtech_turn_secret
      - --realm=camtech.cam
      - --no-tls
      - --no-dtls
      - --verbose

networks:
  camtech-net:
    driver: bridge

volumes:
  redis-data:
  savemedia-downloads:
  bot-downloads:
  kokoro-models:
  kokoro-voices:
  kokoro-temp:
  ollama-data:
  postgres-data:
  ai-uploads:
  podcast-storage:
  stirling-data:
  stirling-configs:
  n8n-data:
