# ══════════════════════════════════════════════════════════════════
#  CamTech — Unified Docker Compose
# ══════════════════════════════════════════════════════════════════
#  All services in the monorepo. Run with:
#    docker compose up --build
#
#  Or run individual services:
#    docker compose up savemedia-frontend savemedia-api cv-studio-api
#    docker compose up auto-post-bot
# ══════════════════════════════════════════════════════════════════

services:

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  #  Redis (For Queue & Rate Limiting)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  redis:
    image: redis:7-alpine
    container_name: camtech-redis
    restart: unless-stopped
    networks:
      - camtech-net

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  #  SaveMedia Web — Frontend Gateway
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  savemedia-frontend:
    build:
      context: ./services/savemedia-web/frontend
      dockerfile: Dockerfile
    container_name: camtech-savemedia-frontend
    ports:
      - "${SAVEMEDIA_PORT:-80}:80"
    depends_on:
      - savemedia-api
      - sticker-api
      - cv-studio-api
    restart: unless-stopped
    networks:
      - camtech-net

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  #  SaveMedia API (FastAPI) & Celery Worker
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  savemedia-api:
    build:
      context: ./services/savemedia-web/media-api
      dockerfile: Dockerfile
    container_name: camtech-savemedia-api
    environment:
      - DOWNLOAD_DIR=/tmp/savemedia_downloads
      - COOKIES_FILE=${COOKIES_FILE:-}
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - savemedia-downloads:/tmp/savemedia_downloads
    expose:
      - "8000"
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - camtech-net

  savemedia-worker:
    build:
      context: ./services/savemedia-web/media-api
      dockerfile: Dockerfile
    container_name: camtech-savemedia-worker
    command: celery -A app.celery_worker.celery_app worker --loglevel=info
    environment:
      - DOWNLOAD_DIR=/tmp/savemedia_downloads
      - COOKIES_FILE=${COOKIES_FILE:-}
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - savemedia-downloads:/tmp/savemedia_downloads
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - camtech-net

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  #  CV & ID Photo AI Studio API — Microservice
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  cv-studio-api:
    build:
      context: ./services/cv-studio-api
      dockerfile: Dockerfile
    container_name: camtech-cv-studio-api
    environment:
      - U2NET_HOME=/app/models
    volumes:
      - cv-models:/app/models
    expose:
      - "8002"
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8002/api/health')" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - camtech-net

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  #  Auto Post Bot — Telegram Bot
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  auto-post-bot:
    build:
      context: .
      dockerfile: ./services/auto-post-bot/Dockerfile
    container_name: camtech-auto-post-bot
    env_file:
      - .env
    volumes:
      - ./credentials:/app/credentials:ro
      - ./cookies.txt:/app/cookies.txt:ro
      - bot-downloads:/app/downloads
    restart: unless-stopped
    networks:
      - camtech-net

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  #  Cloudflare Tunnel (Secure Public Access)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: camtech-tunnel
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    restart: unless-stopped
    networks:
      - camtech-net

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  #  Sticker Maker API — Microservice for Telegram Stickers
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  sticker-api:
    build:
      context: ./services/sticker-maker/sticker-api
      dockerfile: Dockerfile
    container_name: camtech-sticker-api
    environment:
      - STICKER_BOT_TOKEN=${STICKER_BOT_TOKEN:-${TELEGRAM_BOT_TOKEN:-}}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - ALLOWED_USERS=${ALLOWED_USERS:-7673456476}
      - STICKER_BOT_OWNER_ID=${STICKER_BOT_OWNER_ID:-7673456476}
      - DEFAULT_STICKER_USER_ID=${DEFAULT_STICKER_USER_ID:-7673456476}
    expose:
      - "8001"
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/api/health')" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - camtech-net

networks:
  camtech-net:
    driver: bridge

volumes:
  savemedia-downloads:
  bot-downloads:
  cv-models:
