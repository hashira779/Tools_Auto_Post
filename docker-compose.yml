# ══════════════════════════════════════════════════════════════════
#  CamTech — Unified Docker Compose
# ══════════════════════════════════════════════════════════════════
#  All services in the monorepo. Run with:
#    docker compose up --build
#
#  Or run individual services:
#    docker compose up savemedia-frontend savemedia-api
#    docker compose up auto-post-bot
# ══════════════════════════════════════════════════════════════════

services:

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  #  Redis (For Queue & Rate Limiting)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  redis:
    image: redis:7-alpine
    container_name: camtech-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - camtech-net

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  #  SaveMedia Web — Video/Audio Downloader
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  savemedia-frontend:
    build:
      context: ./services/savemedia-web/frontend
      dockerfile: Dockerfile
    container_name: camtech-savemedia-frontend
    ports:
      - "${SAVEMEDIA_PORT:-80}:80"
    depends_on:
      - savemedia-api
      - sticker-api
    restart: unless-stopped
    networks:
      - camtech-net

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  #  SaveMedia API (FastAPI) & Celery Worker
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  savemedia-api:
    build:
      context: ./services/savemedia-web/media-api
      dockerfile: Dockerfile
    container_name: camtech-savemedia-api
    environment:
      - DOWNLOAD_DIR=/tmp/savemedia_downloads
      - COOKIES_FILE=${COOKIES_FILE:-}
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - /mnt/nfs_camtech/savemedia_downloads:/tmp/savemedia_downloads
    expose:
      - "8000"
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    networks:
      - camtech-net

  savemedia-worker:
    build:
      context: ./services/savemedia-web/media-api
      dockerfile: Dockerfile
    container_name: camtech-savemedia-worker
    command: celery -A app.celery_worker.celery_app worker --concurrency=8 --loglevel=info
    environment:
      - DOWNLOAD_DIR=/tmp/savemedia_downloads
      - COOKIES_FILE=${COOKIES_FILE:-}
      - REDIS_URL=redis://redis:6379/0
    volumes:
      - /mnt/nfs_camtech/savemedia_downloads:/tmp/savemedia_downloads
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - camtech-net

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  #  Auto Post Bot — Telegram Bot
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  auto-post-bot:
    build:
      context: .
      dockerfile: ./services/auto-post-bot/Dockerfile
    container_name: camtech-auto-post-bot
    env_file:
      - .env
    volumes:
      - ./credentials:/app/credentials:ro
      - ./cookies.txt:/app/cookies.txt:ro
      - /mnt/nfs_camtech/bot_downloads:/app/downloads
    restart: unless-stopped
    networks:
      - camtech-net

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  #  Cloudflare Tunnel (Secure Public Access)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: camtech-tunnel
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    restart: unless-stopped
    networks:
      - camtech-net

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  #  Sticker Maker API — Microservice for Telegram Stickers
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  sticker-api:
    build:
      context: ./services/sticker-maker/sticker-api
      dockerfile: Dockerfile
    container_name: camtech-sticker-api
    environment:
      - STICKER_BOT_TOKEN=${STICKER_BOT_TOKEN:-${TELEGRAM_BOT_TOKEN:-}}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - ALLOWED_USERS=${ALLOWED_USERS:-}
      - STICKER_BOT_OWNER_ID=${STICKER_BOT_OWNER_ID:-}
      - DEFAULT_STICKER_USER_ID=${DEFAULT_STICKER_USER_ID:-}
      - GOOGLE_APPLICATION_CREDENTIALS=/app/credentials/google_credentials.json
    volumes:
      - ./credentials:/app/credentials:ro
    expose:
      - "8001"
    healthcheck:
      test: [ "CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/api/health')" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped
    networks:
      - camtech-net

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  #  MMS-TTS — Offline Khmer Voice (CPU Optimized)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  mms-tts:
    build:
      context: ./services/mms-tts
      dockerfile: Dockerfile
    container_name: camtech-mms-tts
    restart: unless-stopped
    expose:
      - "8002"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
    networks:
      - camtech-net

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  #  Kokoro-82M TTS — Premium Voice AI (CPU Optimized)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  kokoro-tts:
    image: ghcr.io/remsky/kokoro-fastapi-cpu:latest
    container_name: camtech-kokoro-tts
    restart: unless-stopped
    expose:
      - "8880"
    environment:
      - DEVICE=cpu
      - ONNX_NUM_THREADS=8
      - ONNX_INTER_OP_THREADS=4
      - PYTORCH_NUM_THREADS=8
    volumes:
      - /mnt/nfs_camtech/kokoro-models:/app/api/src/models
      - /mnt/nfs_camtech/kokoro-voices:/app/api/src/voices
      - /mnt/nfs_camtech/kokoro-temp:/tmp/kokoro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8880/health"]
      interval: 30s
      timeout: 10s
    networks:
      - camtech-net

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  #  Ollama — Local LLM API (Optimized for 3B–8B Quantized Models)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

  ollama:
    image: ollama/ollama:latest
    container_name: camtech-ollama
    restart: unless-stopped
    # If your Ubuntu server has an NVIDIA GPU, uncomment the deploy section below:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - camtech-net

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  #  CAMTECH Database (PostgreSQL)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  postgres:
    image: postgres:15-alpine
    container_name: camtech-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: camtech
      POSTGRES_PASSWORD: camtechpassword
      POSTGRES_DB: camtech
    ports:
      # Expose PostgreSQL to LAN so ORS workers can connect
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Custom pg_hba.conf to allow ORS worker connections
      - ./config/pg_hba.conf:/etc/postgresql/pg_hba.conf
    command: >
      postgres
        -c listen_addresses='*'
        -c hba_file=/etc/postgresql/pg_hba.conf
        -c max_connections=300
        -c shared_buffers=1GB
        -c work_mem=16MB
        -c maintenance_work_mem=256MB
        -c effective_cache_size=4GB
    networks:
      - camtech-net

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  #  AI Orchestrator API
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  ai-orchestrator-api:
    build:
      context: ./services/ai-orchestrator-api
      dockerfile: Dockerfile
    container_name: camtech-ai-orchestrator
    env_file:
      - .env
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - OLLAMA_URL=http://ollama:11434
    depends_on:
      - postgres
      - ollama
    volumes:
      - ai-uploads:/app/uploads
    networks:
      - camtech-net

networks:
  camtech-net:
    driver: bridge

volumes:
  ollama-data:
  postgres-data:
  ai-uploads:
