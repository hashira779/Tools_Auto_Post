name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Deploy to Ubuntu Server
        run: |
          echo "Starting deployment..."
          cd ~/CamTech
          git fetch origin main
          git reset --hard origin/main
          python scripts/update.py
          echo "Deployment complete!"
