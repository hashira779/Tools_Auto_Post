# ══════════════════════════════════════════════════════════════════
#  CamTech — ORS Worker Node (AI Only)
# ══════════════════════════════════════════════════════════════════
#  This lightweight compose file runs ONLY the AI services:
#    - AI Orchestrator API (FastAPI)
#    - Ollama (Local LLM)
#
#  It connects to the MAIN server's PostgreSQL over the network.
#  Deploy this on ORS worker servers (10.2.7.251, 10.2.7.252).
#
#  Usage:
#    docker compose -f docker-compose.ors-worker.yml up -d --build
# ══════════════════════════════════════════════════════════════════

services:

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  #  Ollama — Local LLM API
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  ollama:
    image: ollama/ollama:latest
    container_name: ors-ollama
    restart: unless-stopped
    volumes:
      - ollama-data:/root/.ollama
    networks:
      - ors-net

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  #  AI Orchestrator API (FastAPI + ReAct Agent)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  ai-orchestrator-api:
    build:
      context: ./services/ai-orchestrator-api
      dockerfile: Dockerfile
    container_name: ors-ai-orchestrator
    environment:
      # ── Points to MAIN server's PostgreSQL over the LAN ──
      - DATABASE_URL=postgresql://camtech:camtechpassword@10.1.0.11:5432/camtech
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - OLLAMA_URL=http://ollama:11434
      # ── Tool Communication (Point to Main Server) ──
      - PODCAST_API_URL=http://10.1.0.11:8003
      - MMS_TTS_URL=http://10.1.0.11:8002
    depends_on:
      - ollama
    ports:
      # Expose on port 8100 so Nginx on the main server can reach it
      - "8100:8000"
    volumes:
      - ai-uploads:/app/uploads
    restart: unless-stopped
    # Healthcheck is defined in the Dockerfile
    networks:
      - ors-net

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  #  Podcast API & Worker (Distributed Processing)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  podcast-api:
    build:
      context: ./services/podcast-api
      dockerfile: Dockerfile
    container_name: ors-podcast-api
    environment:
      - DATABASE_URL=postgresql://camtech:camtechpassword@10.1.0.11:5432/camtech
      - REDIS_URL=redis://10.1.0.11:6379/1
      - OLLAMA_URL=http://ollama:11434
      - WHISPER_MODEL=medium
      - LLM_MODEL=qwen3:4b
    ports:
      - "8300:8003"
    volumes:
      - podcast-storage:/app/storage
    depends_on:
      - ollama
    restart: unless-stopped
    networks:
      - ors-net

  podcast-worker:
    build:
      context: ./services/podcast-api
      dockerfile: Dockerfile
    container_name: ors-podcast-worker
    command: celery -A app.workers.celery_app worker --concurrency=1 --loglevel=info -Q podcast
    environment:
      - DATABASE_URL=postgresql://camtech:camtechpassword@10.1.0.11:5432/camtech
      - REDIS_URL=redis://10.1.0.11:6379/1
      - OLLAMA_URL=http://ollama:11434
      - WHISPER_MODEL=medium
      - LLM_MODEL=qwen3:4b
      - CPU_THREADS=6
    volumes:
      - podcast-storage:/app/storage
    depends_on:
      - ollama
    restart: unless-stopped
    networks:
      - ors-net

networks:
  ors-net:
    driver: bridge

volumes:
  ollama-data:
  ai-uploads:
  podcast-storage:
