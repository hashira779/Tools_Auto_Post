# Security Rate Limiting Zones
limit_req_zone $binary_remote_addr zone=api_general:10m rate=25r/s;
limit_req_zone $binary_remote_addr zone=api_heavy:10m rate=10r/s;

server {
    listen 80;
    server_name www.camtech.cam;
    return 301 https://camtech.cam$request_uri;
}

server {
    listen 80 default_server;
    server_name _ camtech.cam;

    root /usr/share/nginx/html;
    index index.html;

    # ── Security Headers ──────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Serve static files directly
    location / {
        try_files $uri $uri/ /index.html;
        # Never cache index.html so the user always gets the latest JS/CSS hashes
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Proxy TTS, Sticker Maker & Telegram API requests
    location ~ ^/api/(tts|sticker|telegram)/ {
        limit_req zone=api_heavy burst=20 nodelay;

        resolver 127.0.0.11 valid=5s;
        set $sticker_backend "http://sticker-api:8001";
        proxy_pass $sticker_backend;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_connect_timeout 30s;

        client_max_body_size 25m;
    }

    # Proxy Media API requests to backend microservice
    location /api/ {
        limit_req zone=api_general burst=35 nodelay;

        # Use Docker's internal DNS resolver to avoid stale IPs
        resolver 127.0.0.11 valid=5s;
        set $backend "http://savemedia-api:8000";
        proxy_pass $backend;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Increase timeouts for large downloads
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 30s;

        # Allow large file downloads
        proxy_buffering off;
        client_max_body_size 0;
    }

    # Proxy Ollama AI API requests
    location /api/ollama/ {
        # Use Docker's internal DNS resolver
        resolver 127.0.0.11 valid=5s;
        
        # We rewrite /api/ollama/chat to /api/chat so Ollama understands it
        rewrite ^/api/ollama/(.*) /api/$1 break;
        
        # Send to the camtech-ollama container on port 11434
        set $ollama_backend "http://camtech-ollama:11434";
        proxy_pass $ollama_backend;
        
        # Essential headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering so the LLM text streams instantly
        proxy_buffering off;
        proxy_cache off;
        
        # Increase timeouts since LLMs can take time to think
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 30s;
    }

    # Cache static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 256;
}
