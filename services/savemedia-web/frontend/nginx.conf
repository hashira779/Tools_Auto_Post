# ══════════════════════════════════════════════════════════════════
#  AI Cluster — Multi-Server Load Balancing with Automatic Failover
# ══════════════════════════════════════════════════════════════════
#  Distributes AI requests across 3 servers. If ORS workers go down,
#  traffic automatically falls back to the main server.
#  When ORS workers come back online, they rejoin the pool.
# ══════════════════════════════════════════════════════════════════
upstream ai_cluster {
    # Load balancing strategy: least connections (sends to least busy server)
    least_conn;

    # Main Server — always available (primary)
    server camtech-ai-orchestrator:8000 max_fails=3 fail_timeout=15s;

    # ORS Worker 1 (10.2.7.251) — external AI worker (temporarily disabled due to stale config)
    # server 10.2.7.251:8100 max_fails=2 fail_timeout=10s;

    # ORS Worker 2 (10.2.7.252) — external AI worker (temporarily disabled due to stale config)
    # server 10.2.7.252:8100 max_fails=2 fail_timeout=10s;

    # Keep connections alive to reduce TCP overhead
    keepalive 8;
}

# Security Rate Limiting Zones
limit_req_zone $binary_remote_addr zone=api_general:10m rate=25r/s;
limit_req_zone $binary_remote_addr zone=api_heavy:10m rate=10r/s;

server {
    listen 80;
    server_name www.camtech.cam;
    return 301 https://camtech.cam$request_uri;
}

server {
    listen 80 default_server;
    server_name _ camtech.cam;

    root /usr/share/nginx/html;
    index index.html;

    # ── Security Headers ──────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # ── Block Malicious Scanners ──────────────────────────────────
    # Reject PHP/ASP webshell probes, WordPress scanners, etc.
    location ~* \.(php|asp|aspx|cgi|jsp|pl)$ {
        return 444;  # Nginx drops connection silently
    }

    # Block common WordPress/CMS scanner paths
    location ~* ^/(wp-admin|wp-login|wp-content|wp-includes|xmlrpc\.php|administrator) {
        return 444;
    }

    # Block dotfile access (except .well-known for SSL)
    location ~ /\.(?!well-known) {
        return 444;
    }

    # ── SEO Files — Serve directly with correct Content-Type ─────
    # Must come BEFORE the SPA catch-all to avoid serving index.html
    location = /sitemap.xml {
        root /usr/share/nginx/html;
        default_type application/xml;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location = /robots.txt {
        root /usr/share/nginx/html;
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location = /BingSiteAuth.xml {
        root /usr/share/nginx/html;
        default_type application/xml;
    }

    # Serve static files directly (SPA catch-all)
    location / {
        try_files $uri $uri/ /index.html;
        # Never cache index.html so the user always gets the latest JS/CSS hashes
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Proxy TTS, Sticker Maker & Telegram API requests
    location ~ ^/api/(tts|sticker|telegram)/ {
        limit_req zone=api_heavy burst=20 nodelay;

        resolver 127.0.0.11 valid=5s;
        set $sticker_backend "http://sticker-api:8001";
        proxy_pass $sticker_backend;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_connect_timeout 30s;

        client_max_body_size 25m;
    }

    # Proxy Media API requests to backend microservice
    location /api/ {
        limit_req zone=api_general burst=35 nodelay;

        # Use Docker's internal DNS resolver to avoid stale IPs
        resolver 127.0.0.11 valid=5s;
        set $backend "http://savemedia-api:8000";
        proxy_pass $backend;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Increase timeouts for large downloads
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 30s;

        # Allow large file downloads
        proxy_buffering off;
        client_max_body_size 0;
    }

    # Proxy Ollama AI API requests
    location /api/ollama/ {
        # Use Docker's internal DNS resolver
        resolver 127.0.0.11 valid=5s;
        
        # Send to the camtech-ollama container on port 11434
        set $ollama_backend "http://camtech-ollama:11434";
        
        # We rewrite /api/ollama/chat to /api/chat so Ollama understands it
        rewrite ^/api/ollama/(.*) /api/$1 break;
        
        proxy_pass $ollama_backend;
        
        # Essential headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering so the LLM text streams instantly
        proxy_buffering off;
        proxy_cache off;
        
        # Increase timeouts since LLMs can take time to think
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 30s;
    }

    # Proxy AI Orchestrator API requests (Load Balanced Across AI Cluster)
    location /api/ai/ {
        resolver 127.0.0.11 valid=5s;
        
        rewrite ^/api/ai/(.*) /api/$1 break;
        proxy_pass http://ai_cluster;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for SSE (Server-Sent Events) streaming
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
        
        # Allow large document uploads to AI
        client_max_body_size 50m;
        
        # Generous timeouts for LLM inference (can be slow on CPU)
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 10s;
        
        # If an upstream server fails, try the next one
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 30s;
    }

    # Cache static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;
    gzip_min_length 256;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_proxied any;

    # TCP Optimizations for lower latency
    tcp_nopush on;
    tcp_nodelay on;
}
