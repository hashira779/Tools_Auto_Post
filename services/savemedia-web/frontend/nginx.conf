# ═════════════════════════════════════════════════════════════════
#  AI Cluster — Multi-Server Load Balancing with Automatic Failover
# ═════════════════════════════════════════════════════════════════
#  Distributes AI requests across 3 servers. If ORS workers go down,
#  traffic automatically falls back to the main server.
#  When ORS workers come back online, they rejoin the pool.
# ═════════════════════════════════════════════════════════════════
upstream ai_cluster {
    # Load balancing strategy: least connections (sends to least busy server)
    least_conn;

    # Main Server — only available when AI Orchestrator is running
    # Commented out by default: uncomment when AI Orchestrator container is deployed
    # server camtech-ai-orchestrator:8000 max_fails=3 fail_timeout=15s;

    # ORS Worker 1 (10.2.7.251) — external AI worker
    server 10.2.7.251:8100 max_fails=2 fail_timeout=10s;

    # ORS Worker 2 (10.2.7.252) — external AI worker
    server 10.2.7.252:8100 max_fails=2 fail_timeout=10s;

    # Keep connections alive to reduce TCP overhead
    keepalive 8;
}

# Security Rate Limiting Zones
limit_req_zone $binary_remote_addr zone=api_general:10m rate=25r/s;
limit_req_zone $binary_remote_addr zone=api_heavy:10m rate=10r/s;

server {
    listen 80;
    server_name www.camtech.cam;
    return 301 https://camtech.cam$request_uri;
}

server {
    listen 80 default_server;
    server_name _ camtech.cam;

    root /usr/share/nginx/html;
    index index.html;

    # ── Security Headers ──────────────────────────────────────────
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "display-capture=*, camera=*, microphone=*, geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin-allow-popups" always;

    # Allow large uploads globally in this server block to prevent early 413s
    client_max_body_size 500m;

    # ── Block Malicious Scanners ──────────────────────────────────
    # Reject PHP/ASP webshell probes, WordPress scanners, etc.
    location ~* \.(php|asp|aspx|cgi|jsp|pl)$ {
        return 444;  # Nginx drops connection silently
    }

    # Block common WordPress/CMS scanner paths
    location ~* ^/(wp-admin|wp-login|wp-content|wp-includes|xmlrpc\.php|administrator) {
        return 444;
    }

    # Block dotfile access (except .well-known for SSL)
    location ~ /\.(?!well-known) {
        return 444;
    }

    # ── SEO Files — Serve directly with correct Content-Type ─────
    # Must come BEFORE the SPA catch-all to avoid serving index.html
    location = /sitemap.xml {
        root /usr/share/nginx/html;
        default_type application/xml;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location = /robots.txt {
        root /usr/share/nginx/html;
        default_type text/plain;
        add_header Cache-Control "public, max-age=3600" always;
    }

    location = /BingSiteAuth.xml {
        root /usr/share/nginx/html;
        default_type application/xml;
    }

    # Serve static files directly (SPA catch-all)
    location / {
        try_files $uri $uri/ /index.html;
        # Never cache index.html so the user always gets the latest JS/CSS hashes
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # Proxy TTS, Sticker Maker & Telegram API requests
    location ~ ^/api/(tts|sticker|telegram)/ {
        limit_req zone=api_heavy burst=20 nodelay;

        resolver 127.0.0.11 valid=5s;
        set $sticker_backend "http://sticker-api:8001";
        proxy_pass $sticker_backend;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_connect_timeout 30s;

        client_max_body_size 25m;
    }

    # Proxy n8n workflow API requests from the trigger UI
    location /api/n8n/ {
        limit_req zone=api_general burst=35 nodelay;

        resolver 127.0.0.11 valid=5s;
        set $n8n_api_backend "http://ai-orchestrator-api:8000";
        proxy_pass $n8n_api_backend;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_connect_timeout 30s;
    }

    # Proxy the actual n8n builder UI to be embedded in an iframe
    location ^~ /n8n/ {
        resolver 127.0.0.11 valid=5s;
        set $n8n_backend "http://n8n:5678";
        
        rewrite ^/n8n/(.*) /$1 break;
        proxy_pass $n8n_backend;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Support WebSocket for n8n push updates
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Strip headers that prevent embedding in iframes
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Content-Security-Policy;
        
        # ── N8N WHITE-LABELING VIA NGINX INJECTION ──
        # Disable upstream compression so sub_filter can read the HTML
        proxy_set_header Accept-Encoding "";
        
        # Inject JS to enforce light mode, replace texts, inject logo, and auto-login to bypass n8n auth
        sub_filter '</head>' '<script>(function(){try{localStorage.setItem("theme","light");document.documentElement.setAttribute("data-theme","light");document.documentElement.classList.remove("dark");}catch(e){}var autoFilled=false;var mo=new MutationObserver(function(){document.documentElement.setAttribute("data-theme","light");document.documentElement.classList.remove("dark");document.querySelectorAll("h1, h2, span, p, label, a, button").forEach(function(el){if(el.childNodes.length>0){Array.from(el.childNodes).forEach(function(node){if(node.nodeType===3){if(node.nodeValue.includes("Set up owner account")){node.nodeValue=node.nodeValue.replace("Set up owner account","CamTech Admin Setup");}if(node.nodeValue.includes("n8n")){node.nodeValue=node.nodeValue.replace(/n8n/g,"CamTech");}}});}});var oldLogo=document.querySelector("[data-test-id=\\"n8n-logo\\"]");if(oldLogo){oldLogo.style.display="none";if(!document.getElementById("camtech-injected-logo")){var newLogo=document.createElement("div");newLogo.id="camtech-injected-logo";newLogo.style.textAlign="center";newLogo.style.margin="20px 0";newLogo.style.fontSize="28px";newLogo.style.fontWeight="900";var s1=document.createElement("span");s1.style.color="#3b82f6";s1.textContent="CAM";var s2=document.createElement("span");s2.style.color="#f97316";s2.textContent="TECH";var s3=document.createElement("span");s3.style.color="#1f2937";s3.style.marginLeft="8px";s3.textContent="AUTOMATIONS";newLogo.appendChild(s1);newLogo.appendChild(s2);newLogo.appendChild(s3);oldLogo.parentNode.insertBefore(newLogo,oldLogo);}}if(!autoFilled){var email=document.querySelector("input[type=\\"email\\"], input[name=\\"email\\"]");var pass=document.querySelector("input[type=\\"password\\"], input[name=\\"password\\"]");var fName=document.querySelector("input[name=\\"firstName\\"]");var lName=document.querySelector("input[name=\\"lastName\\"]");var btn=document.querySelector("button[type=\\"submit\\"]");if(email&&pass&&btn){autoFilled=true;email.value="admin@camtech.cam";email.dispatchEvent(new Event("input",{bubbles:true}));pass.value="CamTechAutomations123!";pass.dispatchEvent(new Event("input",{bubbles:true}));if(fName){fName.value="CamTech";fName.dispatchEvent(new Event("input",{bubbles:true}));}if(lName){lName.value="User";lName.dispatchEvent(new Event("input",{bubbles:true}));}setTimeout(function(){if(!btn.disabled)btn.click();},200);}}});document.addEventListener("DOMContentLoaded",function(){mo.observe(document.body,{childList:true,subtree:true,characterData:true});});})();</script></head>';
        sub_filter_once on;
        sub_filter_types text/html;

        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 10s;
    }

    # Proxy Media API requests to backend microservice
    location /api/ {
        limit_req zone=api_general burst=35 nodelay;

        # Use Docker's internal DNS resolver to avoid stale IPs
        resolver 127.0.0.11 valid=5s;
        set $backend "http://savemedia-api:8000";
        proxy_pass $backend;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Increase timeouts for large downloads
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 30s;

        # Allow large file downloads
        proxy_buffering off;
        client_max_body_size 0;
    }

    # Proxy WebRTC Signaling (Socket.IO)
    location /socket.io/ {
        resolver 127.0.0.11 valid=5s;
        set $socket_backend "http://screen-share-api:4000";
        proxy_pass $socket_backend;

        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Don't buffer websockets
        proxy_buffering off;
        proxy_read_timeout 86400s; # Long timeout for persistent connection
        proxy_send_timeout 86400s;
    }

    # Proxy Ollama AI API requests
    location /api/ollama/ {
        # Use Docker's internal DNS resolver
        resolver 127.0.0.11 valid=5s;
        
        # Send to the camtech-ollama container on port 11434
        set $ollama_backend "http://camtech-ollama:11434";
        
        # We rewrite /api/ollama/chat to /api/chat so Ollama understands it
        rewrite ^/api/ollama/(.*) /api/$1 break;
        
        proxy_pass $ollama_backend;
        
        # Essential headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering so the LLM text streams instantly
        proxy_buffering off;
        proxy_cache off;
        
        # Increase timeouts since LLMs can take time to think
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 30s;
    }

    # Proxy AI Orchestrator API requests (Load Balanced Across AI Cluster)
    location /api/ai/ {
        resolver 127.0.0.11 valid=5s;
        
        rewrite ^/api/ai/(.*) /api/$1 break;
        proxy_pass http://ai_cluster;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Disable buffering for SSE (Server-Sent Events) streaming
        proxy_buffering off;
        proxy_cache off;
        proxy_set_header Connection '';
        proxy_http_version 1.1;
        chunked_transfer_encoding off;
        
        # Allow large document uploads to AI
        client_max_body_size 50m;
        
        # Generous timeouts for LLM inference (can be slow on CPU)
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 10s;
        
        # If an upstream server fails, try the next one
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 3;
        proxy_next_upstream_timeout 30s;
    }

    # ── Block non-functional Stirling-PDF pages ─────────────────
    # File Manager & Automate require storage + login (disabled).
    # Redirect users to the tools homepage instead of dead-end pages.
    location = /pdf/files {
        return 302 /pdf/;
    }
    location = /pdf/pipeline {
        return 302 /pdf/;
    }

    # ── Proxy Stirling-PDF Tools ───────────────────────────────
    # Serves the full Stirling-PDF UI at /pdf/ with all 50+ tools
    location ^~ /pdf/ {
        resolver 127.0.0.11 valid=5s;
        set $stirling_backend "http://stirling-pdf:8080";

        # Do NOT rewrite the path. Stirling-PDF will be configured to expect /pdf/
        proxy_pass $stirling_backend;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /pdf;

        # ── Patch: Neutralize Supabase SaaS LockManager errors ──
        # Stirling PDF bundles dormant Supabase code that conflicts
        # with our main app's auth when loaded in an iframe.
        # We inject a script into the HTML that monkey-patches
        # navigator.locks.request to silently skip Supabase locks.
        # This works regardless of browser/Cloudflare JS cache.
        #
        # ── Patch: Hide non-functional File Manager & Automate tabs ──
        # These features require storage.enabled + enableLogin which
        # are disabled. Hide them so users don't hit dead-end uploads.
        proxy_set_header Accept-Encoding "";
        sub_filter '</head>' '<script>(function(){if(navigator.locks){const _r=navigator.locks.request.bind(navigator.locks);navigator.locks.request=function(n,o,c){if(n&&n.indexOf("sb-")>-1){const fn=typeof c==="function"?c:typeof o==="function"?o:null;return fn?Promise.resolve(fn(null)):Promise.resolve()}return _r.apply(navigator.locks,arguments)}}function hideDisabledTabs(){document.querySelectorAll("a,button").forEach(function(el){var t=(el.textContent||"").trim().toLowerCase();var h=(el.getAttribute("href")||"").toLowerCase();if(t==="files"||t==="my files"||t==="automate"||h.indexOf("/files")>-1||h.indexOf("/pipeline")>-1){el.style.display="none"}});if(location.pathname.indexOf("/files")>-1||location.pathname.indexOf("/pipeline")>-1){history.replaceState(null,"","/pdf/");location.replace("/pdf/")}}var mo=new MutationObserver(hideDisabledTabs);document.addEventListener("DOMContentLoaded",function(){mo.observe(document.body,{childList:true,subtree:true});hideDisabledTabs()});const pInterval=setInterval(function(){if(window.google&&window.google.picker&&window.google.picker.PickerBuilder){if(!window.google.picker.PickerBuilder.prototype.setZIndex){window.google.picker.PickerBuilder.prototype.setZIndex=function(){return this;};}clearInterval(pInterval);}},500);})()</script></head>';
        sub_filter_once on;
        sub_filter_types text/html;

        # Large file uploads for PDFs
        client_max_body_size 500m;

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 10s;
    }

    # Cache static assets aggressively
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;
    gzip_min_length 256;
    gzip_comp_level 6;
    gzip_vary on;
    gzip_proxied any;

    # TCP Optimizations for lower latency
    tcp_nopush on;
    tcp_nodelay on;
}
