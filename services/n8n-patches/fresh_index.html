		<!-- Runtime guards: prevent modulepreload links without href from being appended (avoids console spam)
		     and wrap window.open results so reads like .closed are safely handled when COOP blocks access. -->
		<script>
		(function(){
			function isEmptyModulePreload(node){
				try{
					return node && node.tagName==='LINK' && node.rel==='modulepreload' && (!node.getAttribute('href') || node.getAttribute('href').trim()==='');
				}catch(e){return false;}
			}

			const origAppend = Node.prototype.appendChild;
			Node.prototype.appendChild = function(node){
				if (isEmptyModulePreload(node)) return node; // skip adding invalid modulepreload
				return origAppend.call(this,node);
			};

			const origInsertBefore = Node.prototype.insertBefore;
			Node.prototype.insertBefore = function(node, ref){
				if (isEmptyModulePreload(node)) return node;
				return origInsertBefore.call(this,node, ref);
			};

			// Wrap window.open so callers that access .closed don't throw when COOP blocks access.
			const origOpen = window.open.bind(window);
			window.open = function(...args){
				const w = origOpen(...args);
				if (!w) return w;
				try{
					return new Proxy(w, {
						get(target, prop){
							if (prop === 'closed'){
								try{return target.closed;}catch(e){return true;} // treat as closed when access blocked
							}
							const val = target[prop];
							if (typeof val === 'function') return val.bind(target);
							return val;
						},
						set(target, prop, value){
							try{target[prop]=value;return true;}catch(e){return false;}
						}
					});
				}catch(e){
					return w; // if proxying fails, return original
				}
			};
		})();
		</script>
