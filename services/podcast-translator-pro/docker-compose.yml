version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: podcast-pro-redis
    ports:
      - "6380:6379"
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg15
    container_name: podcast-pro-postgres
    environment:
      POSTGRES_USER: podcast
      POSTGRES_PASSWORD: podcastpassword
      POSTGRES_DB: podcast_db
    ports:
      - "5433:5432"
    volumes:
      - podcast-pro-db-data:/var/lib/postgresql/data
    restart: unless-stopped

  podcast-api:
    build: .
    container_name: podcast-pro-api
    ports:
      - "8003:8003"
    environment:
      - DATABASE_URL=postgresql://podcast:podcastpassword@postgres:5432/podcast_db
      - REDIS_URL=redis://redis:6379/0
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
      - WHISPER_MODEL=medium
      - WHISPER_LANGUAGE=km
    depends_on:
      - postgres
      - redis
    volumes:
      - ./storage:/app/storage
      - ./cookies.txt:/app/cookies.txt:ro
    restart: unless-stopped

  podcast-worker:
    build: .
    container_name: podcast-pro-worker
    command: celery -A app.workers.celery_app worker --concurrency=1 --loglevel=info -Q podcast
    environment:
      - DATABASE_URL=postgresql://podcast:podcastpassword@postgres:5432/podcast_db
      - REDIS_URL=redis://redis:6379/0
      - OLLAMA_URL=${OLLAMA_URL:-http://host.docker.internal:11434}
      - WHISPER_MODEL=medium
      - WHISPER_LANGUAGE=km
      - CPU_THREADS=6
    depends_on:
      - postgres
      - redis
    volumes:
      - ./storage:/app/storage
      - ./cookies.txt:/app/cookies.txt:ro
    restart: unless-stopped

volumes:
  podcast-pro-db-data:
