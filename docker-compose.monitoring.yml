# ══════════════════════════════════════════════════════════════════
#  CamTech — Monitoring Stack (Prometheus + Grafana + exporters)
# ══════════════════════════════════════════════════════════════════
#  Optional stack. Run alongside the main compose:
#    docker compose -f docker-compose.yml -f docker-compose.monitoring.yml up -d
#
#  Access:
#    Grafana:    http://SERVER_IP:3001   (admin / value of GRAFANA_ADMIN_PASSWORD)
#    Prometheus: http://SERVER_IP:9090   (bind to LAN only in production!)
# ══════════════════════════════════════════════════════════════════

services:

  prometheus:
    image: prom/prometheus:latest
    container_name: camtech-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      # Bind to localhost only — access via SSH tunnel or Grafana
      - "127.0.0.1:9090:9090"
    restart: unless-stopped
    networks:
      - camtech-net

  grafana:
    image: grafana/grafana:latest
    container_name: camtech-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-changeme}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s:%(http_port)s/
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
    ports:
      - "3001:3000"
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - camtech-net

  # Container-level metrics (CPU / memory / network per container)
  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: camtech-cadvisor
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    restart: unless-stopped
    networks:
      - camtech-net

  # Host-level metrics (disk, CPU, memory, network)
  node-exporter:
    image: prom/node-exporter:latest
    container_name: camtech-node-exporter
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro,rslave
    pid: host
    restart: unless-stopped
    networks:
      - camtech-net

networks:
  camtech-net:
    external: false

volumes:
  prometheus-data:
  grafana-data:
